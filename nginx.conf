# runmu.sh/docs (image mu-docs): nginx serving the VitePress build (dist/) under /docs/. Caddy in front
# of runmu.sh routes `/docs/*` here and everything else to mu-landing; this server only ever sees
# /docs/ paths, and the pages' asset URLs all start with /docs/ (VitePress `base`).
#
# One policy, the runmu.sh site's shape (clients/site/nginx.conf in runmu-sh/client): nothing inline,
# scripts and styles from 'self', fonts from Google Fonts (the one third party), no connections but
# 'self' (the local search index is a same-origin chunk; there is no API). The build guarantees the
# policy holds (scripts/check.mjs: no inline script or style, no data: URL) so a violation here is a
# build regression, not something to relax.

# Vite hashes everything under /docs/assets/ (cache for a year, immutable). shiki.css, vp-icons.css,
# the HTML pages, llms.txt and the .md twins are not hashed: revalidate on every load.
map $request_uri $cache_control {
    default "no-cache";
    "~^/docs/assets/" "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name runmu.sh www.runmu.sh localhost;
    root /usr/share/nginx/html;
    server_tokens off;

    include /etc/nginx/mime.types;
    types { text/markdown md; }
    charset utf-8;
    charset_types text/css text/plain text/markdown image/svg+xml application/javascript;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/markdown image/svg+xml application/javascript application/json application/xml;

    set $csp "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; ";
    set $csp "${csp}font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; ";
    set $csp "${csp}base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $cache_control always;

    # /docs → /docs/ (Caddy may send either).
    location = /docs { return 301 /docs/; }

    # dist/ is mounted at /docs/: /docs/guide/triggers → dist/guide/triggers.html (cleanUrls), a
    # directory → its index.html, anything else the 404 page VitePress built.
    location /docs/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri.html $uri/index.html /404.html;
        error_page 404 /docs/404.html;
    }

    location / { return 404; }
}
