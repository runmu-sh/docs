# Every push to main: build the mu-docs image (nginx + dist under /docs/ with the CSP in nginx.conf)
# and push it to ghcr.io/runmu-sh/mu-docs as :latest and :<sha>. The runmu.sh host pulls :latest;
# Caddy in front routes /docs/* to it (see README "Deploy").
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the pages' "last updated" dates come from git history
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mu-docs:latest
            ghcr.io/${{ github.repository_owner }}/mu-docs:${{ github.sha }}
