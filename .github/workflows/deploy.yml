# Every merge to main (and by hand): build dist/, run the checks, and ship the mu-docs image to
# ghcr.io/runmu-sh/mu-docs tagged `latest` and `sha-<commit>` (the same scheme as runmu-sh/client's
# deploy-sites.yml, so a roll-back is the same: redeploy an earlier sha- tag). The runmu.sh host pulls
# `latest`; Caddy in front routes /docs* to the container (README "Deploy"). Pulling is the owner's
# step, as for mu-landing and mu-web.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the pages' "last updated" dates come from git history
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Downcase REPO_OWNER
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >>"$GITHUB_ENV"
        env:
          GITHUB_REPOSITORY_OWNER: '${{ github.repository_owner }}'
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/mu-docs
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
